[project]
name = "quick-audit-mcp-tools"
version = "0.1.0"
description = "Local MCP wrapper for Quick Audit Tracker Sheets writes, gated Gmail send, Google Places, and PageSpeed Insights."
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.9.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
  "google-api-python-client>=2.130.0",
  "google-auth>=2.29.0",
  "google-auth-oauthlib>=1.2.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
